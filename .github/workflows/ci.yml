name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: enterprise_agent
          POSTGRES_USER: enterprise_agent
          POSTGRES_PASSWORD: change_me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enterprise_agent -d enterprise_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run alembic downgrade f1006submit01
      - name: Verify P1-010 downgrade preserves P1-009 schema
        run: uv run python -m scripts.verify_p1_010_downgrade
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run alembic downgrade c5a005d1f005
      - name: Verify P1-006 downgrade preserves P1-005 tables
        run: uv run python -m scripts.verify_p1_006_downgrade
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run alembic downgrade d1f004a203bc
      - name: Verify P1-005 downgrade and prepare legacy backfill row
        run: uv run python -m scripts.prepare_p1_005_backfill
      - run: uv run alembic upgrade head
      - name: Verify P1-005 legacy backfill
        run: uv run python -m scripts.verify_p1_005_backfill
      - run: uv run alembic check
      - run: uv run alembic downgrade b15a8d09c2f1
      - name: Verify P1-004 downgrade preserves previous tables
        run: uv run python -m scripts.verify_workflow_downgrade
      - run: uv run alembic upgrade head
      - run: uv run pytest
      - name: Seed demo users
        env:
          APP_ENV: test
          DEMO_USER_PASSWORD: "ci-demo-password-not-a-secret"
        run: uv run python -m scripts.seed_demo_users
      - name: Seed demo workflows
        env:
          APP_ENV: test
        run: uv run python -m scripts.seed_demo_workflows
      - name: Seed demo master data
        env:
          APP_ENV: test
        run: uv run python -m scripts.seed_demo_master_data

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

