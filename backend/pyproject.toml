[project]
name = "enterprise-agent-backend"
version = "0.1.0"
description = "Backend skeleton for the Enterprise Agent demo."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143,<0.144",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "asyncpg>=0.30,<1",
    "redis>=6,<7",
    "alembic>=1.16,<2",
    "uvicorn[standard]>=0.35,<1",
    "pwdlib[argon2]>=0.2,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
    "ruff>=0.14,<0.15",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
